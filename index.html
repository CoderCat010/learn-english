<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English জানালা</title>

    <!-- favicon -->
     <link rel="shortcut icon" href="./images/logo.png" type="image/x-icon">

    <!-- css links -->
     <link rel="stylesheet" href="./style.css">
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

     <!-- font -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

      <!-- icon -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- ==========================HEADER PART=========================== -->
     <header>
        <!--
         navbar 
        -->
         <nav class="flex justify-between items-center bg-[#cde7ff56] px-[100px] py-6">
            <!-- navbar logo & title -->
             <div>
                <h1 class="flex items-center justify-center gap-x-1 font-semibold text-lg">English
                    <span><img class="w-[20px]" src="./images/logo.png"></span> 
                    <span class="font-bangla font-medium">জানালা</span>
                </h1>
             </div>

             <!-- nav list -->
              <div class="flex gap-x-10 font-medium text-sm">
                <button class="border border-[#422AD5] py-1 px-3 rounded-sm"><i class="fa-solid fa-circle-question text-[#422AD5]"></i>FAQ</button>
                <button class="border border-[#422AD5] py-1 px-3 rounded-sm"><i class="fa-solid fa-book-open text-[#422AD5]"></i>Learn</button>
                <button class="border border-[#422AD5] py-1 px-3 rounded-sm"><i class="fa-solid fa-arrow-right-from-bracket text-[#422AD5]"></i>Logout</button>
              </div>
         </nav>

         <!-- 
         banner section
          -->
         <div class="hero-content flex-col lg:flex-row gap-x-20 py-16">
            <!-- banner title, input & button -->
            <div>
                <h1 class="text-6xl font-bold"><span class="text-[#00BCFF]">English</span> is Easy!!</h1>
                <p class="py-8 font-bangla text-[17px] font-medium text-[#18181B]">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ.</p>

                <!-- banner input box -->
                <div class="flex flex-col gap-y-5 pb-5">
                    <input type="email" placeholder="Enter Your Name" class="input" />
                    <input type="password" placeholder="-----" class="input" />
                </div>
                <button class="btn btn-primary">Get Started</button>
            </div>

            <!-- banner img -->
            <div>
                <img src="./images/hero-student.png"/>
            </div>
         </div>
     </header>






    <!-- js files -->
     <script src="./script.js"></script>
</body>
</html>
